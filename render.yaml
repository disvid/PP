# Render Blueprint for the backend, on Render's FREE plan (no payment details needed).
# In the Render dashboard: New > Blueprint > pick this repository.
# (The frontend goes to Vercel's free Hobby plan with Root Directory "frontend"; see the README.)
#
# Free-plan limits to know about:
#  - there is no persistent disk, so the SQLite file is wiped whenever the service restarts. The free service also
#    goes to sleep after ~15 minutes without traffic and cold-starts (about a minute) on the next request, so accounts
#    and scores effectively reset after idle periods. Fine for a demo; for real persistence see the README.
#  - a free service is a single instance, which is also what battles need (their queue lives in memory).

services:
  - type: web
    name: proof-puzzle-api
    runtime: docker
    # the image needs frontend/src/data (shared level data), so the build context is the repository root
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_PATH
        value: /data/proof-puzzle.db
      # the Vercel site's address, e.g. https://proof-puzzle.vercel.app (asked for when the Blueprint is created)
      - key: FRONTEND_URL
        sync: false
      # PORT is set by Render itself and read by the server
